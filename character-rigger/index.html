<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Character Rigger — สร้างตัวละครขยับได้</title>
<style>
:root{--bg:#10101e;--p:#191930;--p2:#222244;--b:#34345e;--t:#e8e8ff;--m:#9a9acb;--ac:#f2b84b;--ok:#5ad19a;--bad:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--t);font:13px/1.4 system-ui,"Noto Sans Thai",sans-serif}
#app{display:grid;height:100vh;grid-template-rows:auto 1fr 200px;grid-template-columns:300px 1fr 300px;grid-template-areas:"hd hd hd" "lf cv rt" "ft ft ft"}
header{grid-area:hd;display:flex;gap:6px;align-items:center;padding:6px 10px;background:var(--p);border-bottom:1px solid var(--b);flex-wrap:wrap}
header h1{font-size:15px;margin:0 8px 0 0;color:var(--ac)}
#left{grid-area:lf}#right{grid-area:rt}
#left,#right{background:var(--p);overflow:auto;padding:8px;border:0 solid var(--b)}
#left{border-right-width:1px}#right{border-left-width:1px}
#center{grid-area:cv;position:relative;min-width:0}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#bar{position:absolute;left:8px;top:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#0008;padding:5px 8px;border-radius:8px}
footer{grid-area:ft;background:var(--p);border-top:1px solid var(--b);padding:6px 10px;display:flex;flex-direction:column;gap:6px;min-height:0}
#animbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tl{flex:1;min-height:0;width:100%;background:#0e0e1c;border:1px solid var(--b);border-radius:6px;cursor:ew-resize}
h3{margin:10px 0 4px;font-size:12px;color:var(--ac);text-transform:uppercase;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center}
button,select,input{font:inherit;color:var(--t);background:var(--p2);border:1px solid var(--b);border-radius:6px;padding:3px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}
button.on{background:var(--ac);color:#111;border-color:var(--ac)}
button.sm{padding:1px 6px;font-size:12px}
button.bad:hover{border-color:var(--bad);color:var(--bad)}
input[type=number]{width:70px}input[type=text]{width:100%}
.row{display:flex;gap:4px;align-items:center;padding:3px 4px;border-radius:6px;cursor:pointer}
.row:hover{background:#ffffff0d}.row.sel{background:#f2b84b26;outline:1px solid var(--ac)}
.row .g{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:2px 0}
.f span{color:var(--m);min-width:70px}.f select,.f input[type=text]{flex:1}
.note{color:var(--m);font-size:11px;margin:4px 0}
.thumb{height:30px;width:30px;object-fit:contain;background:#0006;border-radius:4px}
#toast{position:fixed;left:50%;bottom:220px;transform:translateX(-50%);background:#000c;border:1px solid var(--ac);padding:6px 14px;border-radius:8px;display:none;z-index:9}
kbd{background:#0006;border:1px solid var(--b);border-radius:4px;padding:0 4px}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>🎭 Character Rigger</h1>
  <input id="pname" type="text" style="width:130px" title="ชื่อโปรเจกต์">
  <button id="bNew">ใหม่</button>
  <button id="bDemo">โหลดตัวอย่าง</button>
  <button id="bOpen">เปิดไฟล์…</button>
  <button id="bSave">บันทึก .json</button>
  <button id="bPack" class="on">⬇ ส่งออกแพ็คเกจเกม (.zip)</button>
  <button id="bPrompt">📋 คัดลอกคำสั่งให้ Claude</button>
  <input id="fOpen" type="file" accept=".json,application/json" hidden>
  <span class="note" style="margin-left:auto">ล้อเมาส์ = ซูม · ลากพื้นที่ว่าง = เลื่อนมุมมอง · <kbd>Space</kbd> เล่น/หยุด</span>
 </header>
 <aside id="left"></aside>
 <section id="center">
  <canvas id="cv"></canvas>
  <div id="bar">
   <button id="mSetup">① ตั้งโครง</button>
   <button id="mAnim">② อนิเมชั่น</button>
   <button id="bFit" title="ปรับมุมมองให้เห็นตัวละครพอดี">⌖ พอดีจอ</button>
   <label><input type="checkbox" id="cBones" checked> กระดูก</label>
   <label title="จำลองความเร็วเดิน เพื่อดูผ้าลู่ลม">วิ่ง <input type="range" id="rVx" min="-300" max="300" value="0" style="width:90px;padding:0"></label>
  </div>
 </section>
 <aside id="right"></aside>
 <footer>
  <div id="animbar"></div>
  <canvas id="tl"></canvas>
 </footer>
</div>
<div id="toast"></div>

<!-- ================= RUNTIME (ใช้ร่วมกันทั้งในตัวแก้ไขและในเกมที่ส่งออก) ================= -->

<script>
'use strict';
(new Function(document.getElementById('rt').textContent))();
const Rigger = window.Rigger, M = Rigger.math, DEG = Math.PI / 180;
const $ = (s, r = document) => r.querySelector(s);
{ const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...k) { return rc.apply(this, k.flat(9).filter(c => c != null && c !== false)); }; }

/* ---------- DOM helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    const v = attrs[k];
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;

const num = (label, val, step, on) => {
  const i = h('input', { type: 'number', step, value: +(+val).toFixed(3) });
  i.addEventListener('input', () => { const v = parseFloat(i.value); if (!isNaN(v)) on(v); });
  return h('label', { class: 'f' }, h('span', {}, label), i);
};

function rebuild() {

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    const W = cv.width = innerWidth, H = cv.height = innerHeight, groundY = H * 0.75;
    let dir = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
    hero.vx = dir * 240; hero.x += hero.vx * dt; if (dir) hero.facing = dir;
    vy += 1600 * dt; jumpY += vy * dt; if (jumpY > 0) { jumpY = 0; vy = 0; } hero.y = jumpY;
    if (!attacking) hero.play(dir && has('walk') ? 'walk' : (has('idle') ? 'idle' : rig.animationNames()[0]));
    hero.update(dt);
    ctx.fillStyle = '#12122a'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.translate(W / 2 - hero.x, groundY);
    ctx.strokeStyle = '#ffffff22'; for (let x = Math.floor((hero.x - W) / 100) * 100; x < hero.x + W; x += 100) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 12); ctx.stroke(); }
    ctx.strokeStyle = '#f2b84b'; ctx.beginPath(); ctx.moveTo(hero.x - W, 0); ctx.lineTo(hero.x + W, 0); ctx.stroke();
    hero.draw(ctx); ctx.restore();
    hud.textContent = '← → / A D เดิน   Space กระโดด   J โจมตี   O เปลี่ยนชุด' + (outfits.length ? '  (' + (oi < 0 ? 'ชุดเริ่มต้น' : outfits[oi]) + ')' : '');
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})().catch(e => { document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f88;padding:12px">' + e + '</pre>'); });
\x3c/script></body></html>
`;

function buildReadme() {
  const P = S.project, F = '`'.repeat(3);
  const bones = P.bones.map(b => b.name + (b.physics ? ' (spring)' : '')).join(', ');
  const slots = P.slots.map(s => `- ${s.name} (bone ${s.bone}): ${s.attachments.map(a => a.name).join(' | ')}   default=${s.attachment}`).join('\n');
  const outs = Object.keys(P.outfits).map(n => `- "${n}"`).join('\n') || '- (none)';
  const anims = Object.entries(P.animations).map(([n, a]) => `- "${n}" ${a.duration}s ${a.loop === false ? 'once' : 'loop'}`).join('\n') || '- (none)';
  return `# ${P.name} — character package (Character Rigger)

2D skeletal puppet character for the web browser (Canvas 2D, no dependencies).

## Files
- rigger-runtime.js  — runtime (global \`Rigger\`)
- character.json     — rig + animations + outfits (images referenced from images/)
- images/*.png       — body part images
- character.data.js  — same data with images embedded (\`window.CHARACTER_DATA\`) so it works from file://
- game-demo.html     — minimal playable example (arrows move, Space jump, J attack, O outfit)

## Quick use
${F}html
<canvas id="c"></canvas>
\x3cscript src="rigger-runtime.js">\x3c/script>
\x3cscript src="character.data.js">\x3c/script>
\x3cscript>
(async () => {
  const ctx = document.getElementById('c').getContext('2d');
  const rig  = await Rigger.load(window.CHARACTER_DATA);   // or Rigger.load('character.json') over http
  const hero = rig.spawn({ x: 200, y: 400, scale: 2 });    // (x,y) = feet position, y grows downward
  hero.play('idle');
  let last = performance.now();
  (function loop(now) {
    const dt = (now - last) / 1000; last = now;
    hero.vx = 0;               // px/s horizontal velocity: drives cape/hair physics
    hero.update(dt);
    ctx.clearRect(0, 0, 800, 600);
    hero.draw(ctx);
    requestAnimationFrame(loop);
  })(last);
})();
\x3c/script>
${F}

## API (Character)
- fields: x, y, scale, facing (1 right / -1 left), vx, vy (vx is used by spring physics), speed, physicsOn
- play(name, {loop, speed, restart})   — switch animation; no-op restart if already playing unless restart:true
- onComplete = name => {}              — called when a non-looping animation ends
- equip(slot, attachment) / unequip(slot) / unequipAll() / equipOutfit(outfitName) / getOutfit()
- update(dt) / draw(ctx)               — draw(ctx) respects the ctx's current transform (camera)
- boneWorld(name) -> {x, y, rotation}  — world position of a bone, e.g. to spawn effects at "armF"
- pick(x, y) -> slot index or -1       — hit test in world coordinates
- Rigger.load(urlOrObject, {basePath}) -> Promise<Rig>; rig.spawn(opts); rig.animationNames(); rig.outfitNames()

## This character
Bones: ${bones}

Slots (draw order back -> front):
${slots}

Outfits:
${outs}

Animations:
${anims}
`;
}
function exportPackage() {
  if (!S.project.slots.length) return toast('ยังไม่มีสลอต — เพิ่มชิ้นส่วนก่อน');
  const P = JSON.parse(JSON.stringify(S.project)), enc = new TextEncoder(), files = [];
  const embedded = JSON.stringify(P);
  P.images.forEach(im => { files.push({ name: 'images/' + im.name + '.png', data: dataUrlBytes(im.src) }); im.src = 'images/' + im.name + '.png'; });
  files.unshift({ name: 'character.json', data: enc.encode(JSON.stringify(P, null, 1)) });
  files.push({ name: 'character.data.js', data: enc.encode('window.CHARACTER_DATA = ' + embedded + ';\n') });
  files.push({ name: 'rigger-runtime.js', data: enc.encode($('#rt').textContent.trim() + '\n') });
  files.push({ name: 'game-demo.html', data: enc.encode(GAME_DEMO) });
  files.push({ name: 'README.md', data: enc.encode(buildReadme()) });
  download((S.project.name || 'character') + '-game-package.zip', makeZip(files));
  toast('ส่งออกแพ็คเกจแล้ว — แตก zip แล้วเปิด game-demo.html ได้เลย');
}
function claudePrompt() {
  return `ช่วยต่อยอดเป็นเกมเว็บเบราว์เซอร์ (HTML + Canvas + JavaScript ล้วน) โดยใช้ตัวละครจากแพ็คเกจ Character Rigger ที่แนบมา\n` +
    `- ใช้ rigger-runtime.js + character.data.js ตามตัวอย่างใน game-demo.html (อย่าแก้ runtime)\n` +
    `- เกมที่ต้องการ: [ระบุ เช่น เกมแพลตฟอร์มวิ่งเก็บเหรียญ / ต่อสู้มอนสเตอร์]\n\n` + buildReadme();
}

/* ---------- wiring ---------- */
$('#mSetup').onclick = () => { S.mode = 'setup'; S.ch.setupPose = true; S.ch.pose(0); renderModeBar(); renderProps(); };
$('#mAnim').onclick = () => { S.mode = 'anim'; S.ch.setupPose = false; S.ch.pose(0); renderModeBar(); renderProps(); };
$('#bFit').onclick = fitCamera;
$('#cBones').onchange = e => S.showBones = e.target.checked;
$('#rVx').oninput = e => S.testVx = +e.target.value;
$('#pname').onchange = e => { S.project.name = e.target.value.trim() || 'character'; autosave(); };
$('#bNew').onclick = () => { if (confirm('เริ่มโปรเจกต์ใหม่? (งานเดิมที่ยังไม่ได้บันทึกจะหาย)')) setProject(newProject()); };
$('#bDemo').onclick = () => { if (confirm('โหลดตัวอย่าง? (งานเดิมที่ยังไม่ได้บันทึกจะถูกแทนที่)')) setProject(demoProject()); };
$('#bOpen').onclick = () => $('#fOpen').click();
$('#fOpen').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try { const p = JSON.parse(await f.text()); if (!p.bones || !p.slots) throw 0; p.outfits = p.outfits || {}; p.animations = p.animations || {}; p.images = p.images || []; await setProject(p); }
  catch (err) { toast('ไฟล์โปรเจกต์ไม่ถูกต้อง'); }
};
$('#bSave').onclick = () => download((S.project.name || 'character') + '.rigger.json', new Blob([JSON.stringify(S.project)], { type: 'application/json' }));
$('#bPack').onclick = exportPackage;
$('#bPrompt').onclick = async () => { const t = claudePrompt(); try { await navigator.clipboard.writeText(t); toast('คัดลอกแล้ว — วางให้ Claude พร้อมแนบไฟล์ zip'); } catch (e) { prompt('คัดลอกข้อความนี้', t); } };
addEventListener('keydown', e => { if (e.code === 'Space' && !/INPUT|SELECT|TEXTAREA|BUTTON/.test(e.target.tagName)) { e.preventDefault(); togglePlay(); } });

(async () => {
  let p = null; try { p = JSON.parse(localStorage.getItem('rigger-project')); } catch (e) {}
  await setProject(p && p.bones && p.slots ? p : demoProject());
  requestAnimationFrame(frame);
})();
</script>
