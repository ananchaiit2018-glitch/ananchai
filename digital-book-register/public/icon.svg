  <path d="M160 158 H194 M184 148 L194 158 L184 168" fill="none" stroke="#10234A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M196 176 H162 M172 166 L162 176 L172 186" fill="none" stroke="#10234A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
