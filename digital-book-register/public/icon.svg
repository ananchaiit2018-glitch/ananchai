  <path d="M128 70 C108 58 74 54 44 60 V190 C74 184 108 188 128 200 Z" fill="url(#pg)"/>
  <path d="M128 70 C148 58 182 54 212 60 V190 C182 184 148 188 128 200 Z" fill="url(#pg)"/>
