    <path d="M60 92 C80 89 100 90 114 95"/>
    <path d="M60 116 C80 113 100 114 114 119"/>
    <path d="M60 140 C80 137 100 138 114 143"/>
    <path d="M60 164 C80 161 96 162 106 165"/>
